name: Build & Deploy

# Deploys use the data committed in public/data. The refresh-data workflow keeps
# that data current (daily) and triggers a deploy when it changes, so a push to
# main never depends on Bungie / Clarity / Google being reachable.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Bust cache only when source files change, not on every push.
          key: nextjs-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'package-lock.json') }}
          restore-keys: nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:ci

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
