name = "d2theorycraft"
compatibility_date = "2024-09-23"

# Explicit main entry — prevents Wrangler from trying to auto-configure the
# Next.js adapter (which would fail on Next.js < 14.2.35). The Worker itself
# does nothing except forward every request to the static asset store.
main = "worker.ts"

# All site files come from the Next.js static export (next build → out/).
[assets]
directory = "./out"
binding = "ASSETS"
# A matching static file is normally served without running the Worker. These paths run it first so shared roll links
# (/editor?w=...) get their link-preview tags; every other request still goes straight to the assets.
run_worker_first = ["/editor", "/editor/"]

# The Worker is a pass-through, so per-invocation log persistence is just cost
# and noise. Re-enable `[observability]` here if request logs are ever needed.
